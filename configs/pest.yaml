model:
  name: "agrivyn_pest_yolov8n"
  architecture: "yolov8n.pt"
  num_classes: 12
  input_size: 640

training:
  epochs: 8
  batch_size: 16
  imgsz: 640
  sample_limit: 800
  random_seed: 42
  device: "cpu"

data:
  dataset_root: "DATASETS/Pest Detection"
  data_yaml: "DATASETS/Pest Detection/data.yaml"

paths:
  save_dir: "models/pest"
  model_filename: "pest_model_v1.pt"
  metrics_output: "models/pest/metrics.json"
