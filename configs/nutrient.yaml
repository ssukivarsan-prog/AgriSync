model:
  name: "agrivyn_nutrient_mobilenetv3"
  architecture: "mobilenet_v3_small"
  num_classes: 9
  input_size: [224, 224]

training:
  batch_size: 32
  epochs: 6
  learning_rate: 0.001
  weight_decay: 0.0001
  random_seed: 42

data:
  dataset_root: "DATASETS/Nutrient Deficiency Detection"
  train_split: "train"
  val_split: "val"
  test_split: "test"

paths:
  save_dir: "models/nutrient"
  model_filename: "nutrient_model_v1.pt"
  class_mapping: "models/nutrient/class_mapping.json"
  metrics_output: "models/nutrient/metrics.json"
